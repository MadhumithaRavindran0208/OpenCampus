{% extends "base.html" %}
{% block title %}Sign in &mdash; OpenCampus OSS{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Sign in</h1>
    <p class="muted small">Welcome back. Sign in to claim issues, request mentorship, and track your contributions.</p>
    <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="small muted" style="margin-top:16px;">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
