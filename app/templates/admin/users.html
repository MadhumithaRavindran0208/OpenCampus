{% extends "base.html" %}
{% block title %}Manage users &mdash; OpenCampus OSS{% endblock %}
{% block content %}
<p class="small muted"><a href="{{ url_for('admin.dashboard') }}">&larr; Admin dashboard</a></p>
<h1>Users</h1>
<div class="card">
    <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        {% for u in users %}
            <tr>
                <td>{{ u.full_name }}</td>
                <td class="small muted">{{ u.email }}</td>
                <td>
                    <form method="post" action="{{ url_for('admin.set_role', user_id=u.id) }}" style="display:flex; gap:6px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <select name="role">
                            {% for r in roles %}<option value="{{ r }}" {% if u.role == r %}selected{% endif %}>{{ r.replace('_',' ') }}</option>{% endfor %}
                        </select>
                        <button type="submit" class="btn btn-sm btn-ghost">Save</button>
                    </form>
                </td>
                <td><span class="pill pill-{{ 'success' if u.is_active else 'danger' }}">{{ 'active' if u.is_active else 'disabled' }}</span></td>
                <td>
                    <form method="post" action="{{ url_for('admin.toggle_active', user_id=u.id) }}" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="active" value="{{ '0' if u.is_active else '1' }}">
                        <button type="submit" class="btn btn-sm btn-danger">{{ 'Disable' if u.is_active else 'Enable' }}</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
